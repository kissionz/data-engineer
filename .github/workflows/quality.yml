name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run check

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm pack --pack-destination "${RUNNER_TEMP}"
      - run: mkdir -p "${RUNNER_TEMP}/montane-consumer"
      - run: npm init -y
        working-directory: ${{ runner.temp }}/montane-consumer
      - run: npm install "${RUNNER_TEMP}/montane-code-0.3.0.tgz" --ignore-scripts
        working-directory: ${{ runner.temp }}/montane-consumer
      - run: ./node_modules/.bin/montane --version
        working-directory: ${{ runner.temp }}/montane-consumer
      - run: ./node_modules/.bin/montane doctor --json
        working-directory: ${{ runner.temp }}/montane-consumer
      - run: ./node_modules/.bin/harness --version
        working-directory: ${{ runner.temp }}/montane-consumer
